services:
  postgres:
    image: postgres:16-alpine
    container_name: unefa-postgres-16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: unefa_password
      POSTGRES_DB: unefa_bss
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d unefa_bss"]
      interval: 5s
      timeout: 5s
      retries: 10

  scylla-node1:
    image: scylladb/scylla:5.4
    container_name: scylla-node1
    command: --smp 1 --memory 512M --overprovisioned 1 --api-address 0.0.0.0
    ports:
      - "9042:9042"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster'"]
      interval: 10s
      timeout: 10s
      retries: 15